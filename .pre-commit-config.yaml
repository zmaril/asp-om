repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (per top-level unit)
        entry: scripts/typecheck.sh
        language: system
        types: [python]
        pass_filenames: false
      - id: straitjacket
        name: straitjacket
        entry: straitjacket
        language: system
        pass_filenames: false
        always_run: true
